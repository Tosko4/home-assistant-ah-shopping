search_products:
  name: Search products
  description: Search the AH product catalogue.
  fields:
    query:
      required: true
      selector: {text: {}}
    limit:
      default: 8
      selector: {number: {min: 1, max: 20, mode: box}}
lookup_barcode:
  name: Look up barcode
  fields:
    barcode:
      required: true
      selector: {text: {}}
add_product:
  name: Add product
  fields:
    product_id:
      required: true
      selector: {number: {mode: box}}
    quantity:
      default: 1
      selector: {number: {min: 1, max: 99, mode: box}}
add_barcode:
  name: Add scanned barcode
  fields:
    barcode:
      required: true
      selector: {text: {}}
    quantity:
      default: 1
      selector: {number: {min: 1, max: 99, mode: box}}
set_quantity:
  name: Set quantity
  fields:
    product_id:
      required: true
      selector: {number: {mode: box}}
    quantity:
      required: true
      selector: {number: {min: 0, max: 99, mode: box}}
remove_product:
  name: Remove product
  fields:
    product_id:
      required: true
      selector: {number: {mode: box}}
refresh:
  name: Refresh list

set_checked:
  name: Check or uncheck item
  description: Mark an AH shopping-list item as completed or active.
  fields:
    item_id:
      required: true
      selector: {text: {}}
    checked:
      required: true
      selector: {boolean: {}}
add_text:
  name: Add text item
  description: Add a free-text item to AH Mijn lijst.
  fields:
    description:
      required: true
      selector: {text: {}}
    quantity:
      default: 1
      selector: {number: {min: 1, max: 99, mode: box}}
delete_item:
  name: Delete list item
  description: Delete any AH shopping-list item by item id.
  fields:
    item_id:
      required: true
      selector: {text: {}}
